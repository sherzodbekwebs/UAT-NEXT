name: Deploy Next.js via SFTP SSH

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    env:
      # Build vaqtida API manzili kerak bo'lsa:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: ⚡ Restore Next.js build cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build Project
      run: npm run build

    - name: 📂 Sync files via SSH (SFTP)
      uses: easingthemes/ssh-deploy@main
      with:
          # GitHub Secrets-da yaratgan SSH Private Key-ingiz
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Agar kalit yaratishda parol qo'ygan bo'lsangiz:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }} 
          # Server ma'lumotlari
          REMOTE_HOST: ${{ secrets.FTP_SERVER }}   # uz04.ahost.uz
          REMOTE_USER: ${{ secrets.FTP_USERNAME }} # uzautotr
          REMOTE_PORT: 22                          # Standart SSH porti
          # Qayerdan va qayerga yuklash
          SOURCE: "out/"                           # Build papkasi
          TARGET: "/home/uzautotr/public_html/"    # Serverdagi aniq yo'l
          # rsync parametrlari (Faqat o'zgargan fayllarni juda tez yuklaydi)
          ARGS: "-rlgoDzvc -i --delete" 
          # Keraksiz papkalarni chetlab o'tish
          EXCLUDE: "/node_modules/, /.git/, /.github/"