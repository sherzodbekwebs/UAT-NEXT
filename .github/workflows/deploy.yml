name: Deploy Next.js to cPanel

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: ⚡ Restore Next.js build cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build Project
      run: npm run build

    - name: 📂 Sync files to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
              server: ${{ secrets.FTP_SERVER }}
              username: ${{ secrets.FTP_USERNAME }}
              password: ${{ secrets.FTP_PASSWORD }}
              local-dir: ./out/
              server-dir: ./public_html/  # Odatda cPanel-da public_html bo'ladi, buni tekshiring
              # --- OPTIMALLASHTIRISH ---
              port: 21
              # Ba'zi serverlar "state" faylini o'qishda xatolik beradi, 
              # ulanish uzilaversa buni vaqtinchalik o'chirib turing:
              # state-name: .ftp-deploy-sync-state.json 
              
              # ECONNRESET-ni oldini olish uchun asosiy parametrlar:
              timeout: 120000 # 2 daqiqa
              # Agar fayllar ko'p bo'lsa, bir vaqtning o'zida hammasini jo'natishga urinmasligi uchun:
              # (Bu action-da parallel limit yo'q, lekin quyidagilar yordam beradi)
              dangerous-clean-slate: false
              exclude: |
                **/.git*
                **/.git*/**
                **/node_modules/**
                .github/**
                .next/cache/**