name: Deploy Next.js via SFTP SSH

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🛠️ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: ⚡ Restore Next.js build cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🏗️ Build Project
      run: npm run build

    - name: 📂 Deploy via SSH
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }} # Bu faqat env-da ishlaydi
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.FTP_SERVER }}
        REMOTE_USER: ${{ secrets.FTP_USERNAME }}
        REMOTE_PORT: 22 # AGAR "CONNECTION REFUSED" CHIQSA, SHUNI O'ZGARTIRING
        SOURCE: "out/"
        TARGET: "/home/uzautotr/public_html/"
        ARGS: "-rlgoDzvc -i --delete"